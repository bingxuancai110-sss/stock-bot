name: Retry Morning Warmup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger existing authenticated warmup
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo 'CRON_SECRET is not configured'; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 60 \
            --request POST --get --data-urlencode "token=$CRON_SECRET" \
            https://stock-bot-6xct.onrender.com/cron/warmup
