name: V3 isolated market API tests
on:
  push:
    branches: ['test/v3-readonly-market-api']
permissions:
  contents: read
jobs:
  v3-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Flask==3.0.3 requests
      - name: Require Flask and run all V3 tests
        run: |
          python -c "import flask"
          python -m unittest -v test_v3_market_api
