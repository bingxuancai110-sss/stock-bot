name: Daily Watchlist Push

on:
  schedule:
    - cron: "0 0 * * 1-5"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Push API
        run: |
          curl -X POST "https://stock-bot-6xct.onrender.com/cron/push-watchlist?token=${{ secrets.CRON_SECRET }}" --max-time 60
