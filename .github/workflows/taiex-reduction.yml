name: TAIEX close reduction reminders
on:
  schedule:
    # UTC; Taiwan 13:40, 14:10, 15:10.
    - cron: '40 5 * * 1-5'
    - cron: '10 6,7 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/taiex-reduction.yml'
      - 'scripts/check_taiex_reminder.py'
      - 'taiex_cron_auth.py'
      - 'taiex_market_data.py'
      - 'taiex_job_store.py'
      - 'taiex_jobs.py'
permissions:
  contents: read
  id-token: write
concurrency:
  group: taiex-reduction
  cancel-in-progress: false
jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run and verify close check
        run: python scripts/check_taiex_reminder.py
