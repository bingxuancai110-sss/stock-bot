<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>V3 模擬基金</title>
<style>body{font:16px system-ui,sans-serif;color:#142536;background:#f6f8fb;max-width:920px;margin:32px auto;padding:0 16px}h1{margin-bottom:4px}p{color:#48576a}section{background:white;border:1px solid #dce3ed;border-radius:12px;padding:18px;margin:16px 0;overflow:auto}label{display:block;margin-bottom:8px}input,button{font:inherit;padding:10px;border:1px solid #aab5c4;border-radius:6px}input{max-width:100%;box-sizing:border-box}button{background:#183c5b;color:white;cursor:pointer}table{width:100%;border-collapse:collapse;text-align:right;font-variant-numeric:tabular-nums}th,td{padding:9px;border-bottom:1px solid #e3e8ef;white-space:nowrap}th:first-child,td:first-child{text-align:left}#status{font-weight:600}dl{display:grid;grid-template-columns:1fr 1fr;gap:8px}dd{text-align:right;margin:0}</style>
<h1>V3 模擬基金</h1><p id="mode-note">測試環境（STAGING）可能使用合成資料，請以資料模式及核對狀態為準。</p><p>唯讀績效管理 · 不涉及真實交易</p>
<section><form id="auth"><label for="token">專屬唯讀金鑰（僅本次頁面使用）</label><input id="token" type="password" autocomplete="off" required minlength="32"><button>讀取基金</button></form><p id="status" role="status">尚未讀取</p><dl id="summary"></dl></section>
<section><h2>持股</h2><table><thead><tr><th>股票代號</th><th>股數</th><th>帳列成本</th><th>類別</th></tr></thead><tbody id="positions"></tbody></table></section>
<section><h2>應收股利</h2><table><thead><tr><th>股票代號</th><th>金額</th><th>發放日</th></tr></thead><tbody id="claims"></tbody></table></section>
<section><h2>最近績效快照（最多 30 筆）</h2><table><thead><tr><th>時間</th><th>資產</th><th>淨值</th><th>報酬率</th></tr></thead><tbody id="marks"></tbody></table><p>沒有已保存快照時不推算淨值。歷史不完整時，最大回撤及報酬可能無法完整比較。</p></section>
<script>
'use strict';
const el=id=>document.getElementById(id);
const text=(tag,value)=>{const n=document.createElement(tag);n.textContent=String(value??'—');return n};
function row(body,values){const tr=document.createElement('tr');for(const v of values)tr.append(text('td',v));el(body).append(tr)}
function clear(){for(const id of ['summary','positions','claims','marks'])el(id).replaceChildren()}
function show(d){clear();if(d.paper_only!==true)throw Error('invalid response');el('status').textContent=d.data_mode==='synthetic_only'?'STAGING：合成測試帳本，非真實基金；禁止交易':d.reconciled?'帳本已核對；'+(d.history_complete?'歷史完整':'歷史仍不完整'):'歷史帳本尚未核對，禁止新增模擬成交';for(const [k,v] of [['原始本金',d.capital],['帳列現金',d.cash],['累計費用',d.fees],['累計證交稅',d.tax],['帳本版本',d.revision],['帳本時間',d.as_of]])el('summary').append(text('dt',k),text('dd',v));for(const [code,p] of Object.entries(d.positions||{}))row('positions',[code,p.shares,p.basis,p.sleeve]);for(const p of Object.values(d.receivables||{}))row('claims',[p.code,p.amount,p.pay_date]);for(const m of d.marks||[])row('marks',[m.as_of,m.equity,m.nav,m.return_pct]);}
el('auth').addEventListener('submit',async e=>{e.preventDefault();const token=el('token').value;el('token').value='';clear();el('status').textContent='讀取中';try{const r=await fetch('/api/v3/fund/performance',{headers:{Authorization:'Bearer '+token},cache:'no-store',credentials:'omit',redirect:'error'});if(!r.ok)throw Error('HTTP '+r.status);show(await r.json())}catch(err){clear();el('status').textContent='讀取失敗，請確認權限或連線'}});
</script></html>
